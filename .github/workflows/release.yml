name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - name: Build the registry zip set
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          NAME=terraform-provider-watchtower
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            os=${target%/*}; arch=${target#*/}
            ext=; [ "$os" = windows ] && ext=.exe
            bin="${NAME}_v${VERSION}${ext}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w" -o "$bin" ./terraform
            zip -q "dist/${NAME}_${VERSION}_${os}_${arch}.zip" "$bin"
            rm "$bin"
          done
          cp terraform-registry-manifest.json "dist/${NAME}_${VERSION}_manifest.json"
          (cd dist && sha256sum *.zip "${NAME}_${VERSION}_manifest.json" > "${NAME}_${VERSION}_SHA256SUMS")
      - name: Sign checksums (skipped without GPG_PRIVATE_KEY)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then echo "GPG_PRIVATE_KEY not set: release is unsigned (the registry requires a signature)"; exit 0; fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign \
            "dist/terraform-provider-watchtower_${GITHUB_REF_NAME#v}_SHA256SUMS"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*'
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
